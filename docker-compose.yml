# BetterHRBUST 容器化部署（web + server + MongoDB + Redis）
#
#   1. 配置服务端：复制 server/.env.example 为 server/.env，并把 JWT_SECRET
#      换成随机长字符串（本地开发与容器共用这一份配置）
#   2. （可选）复制根目录 .env.example 为 .env，仅用于调整对外映射端口
#   3. docker compose up -d --build
#   4. 创建初始超级管理员（admin 端不在本编排内，需另行部署）：
#        docker compose exec server seed-admin -username admin -nickname 超级管理员
#   5. 访问 Web：http://localhost:8080（若改了 WEB_PORT 则以该端口为准）
#
# 隐私约定：本编排中 MongoDB 只保存意见反馈与管理员账号，
# Redis 只保存短时限流计数，不承载任何学生信息。

name: betterhrbust

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 限流计数无需持久化：关闭 RDB/AOF，重启即清空，避免磁盘上留下任何请求痕迹
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    # 服务端配置的单一来源：本地开发与容器共用 server/.env，
    # 因此 JWT_SECRET、SMTP、快捷回复文案等都只在这一处维护。
    # 该文件不存在时 compose 会直接报错，避免带着默认配置静默启动。
    env_file:
      - ./server/.env
    environment:
      # 以下变量在容器内必须与本地开发取值不同，显式覆盖 env_file 中的同名项
      PORT: "9191"
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
      # web 容器的 nginx 是唯一代理，显式声明其所在网段后才会解析 X-Forwarded-For；
      # 如需调整，在根目录 .env 中设置 TRUSTED_PROXIES 覆盖此默认值
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-9191}:9191"

  web:
    build:
      # Web 端会内联仓库根的 shared/ 共享数据，构建上下文必须是仓库根目录
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:

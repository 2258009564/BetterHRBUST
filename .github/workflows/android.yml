name: Android 验证与构建

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: ['**']
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: '测试通过后发布固定签名的正式 Android APK（仅主分支）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装编译平台
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 发布产物检查回归
        run: python3 -m unittest discover -s android/tools -p 'test_*.py'
      - name: 测试、Lint 与 APK 构建
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: 验证正式签名配置（临时测试密钥）
        working-directory: android
        run: |
          if ./gradlew :app:help -PrequireReleaseSigning=true > "$RUNNER_TEMP/signing-required.log" 2>&1; then
            echo "::error::缺少密钥时正式构建未被拒绝"; exit 1
          fi
          grep -q '正式发布必须提供固定签名密钥' "$RUNNER_TEMP/signing-required.log"
          keytool -genkeypair -keystore "$RUNNER_TEMP/signing-test.jks" -storepass ci-test-only -keypass ci-test-only -alias signing-test -dname "CN=CI Signing Test" -keyalg RSA -validity 1 -noprompt
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/signing-test.jks"
          export ANDROID_STORE_PASSWORD=ci-test-only ANDROID_KEY_PASSWORD=ci-test-only ANDROID_KEY_ALIAS=signing-test
          ./gradlew :app:assembleRelease -PrequireReleaseSigning=true --stacktrace
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          rm -f app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/signing-test.jks"
      - name: 保存验证报告与构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetterHRBUST-Android
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
          if-no-files-found: warn

  release:
    if: github.repository == 'Glassous/BetterHRBUST' && (startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装编译平台
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 读取固定签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then echo "::error::缺少签名 Secret：$variable"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          chmod 600 "$RUNNER_TEMP/android-release.jks"
      - name: 构建正式签名 APK
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/android-release.jks"
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PrequireReleaseSigning=true --stacktrace
      - name: 验证签名与版本
        id: package
        env:
          REF: ${{ github.ref }}
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          python3 android/tools/prepare-release.py
      - name: 发布正式安装包
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          APK: ${{ steps.package.outputs.apk }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::该版本已发布，禁止覆盖既有安装包；请先提高 versionName/versionCode"
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BetterHRBUST Android ${TAG#android-}" --notes-file android/RELEASE_NOTES.md
      - name: 清理临时签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"

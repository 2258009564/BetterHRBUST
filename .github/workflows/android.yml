name: Android 验证与构建

on:
  pull_request:
    paths: ['android/**', 'shared/school-calendar.json', 'tools/generate-school-calendar.mjs', '.github/workflows/android.yml']
  push:
    paths: ['android/**', 'shared/school-calendar.json', 'tools/generate-school-calendar.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 校历共享数据（shared/）被 Android 与 web 两端生成/消费，改动需校验一致性
      - name: 检查校历共享数据
        run: node tools/generate-school-calendar.mjs --check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: 安装编译平台
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      # 正式签名密钥：在仓库 Settings → Secrets and variables → Actions 中配置（见 README「Android 客户端」）。
      # 未配置时 Release 产物为未签名 APK，仅用于验证，不能对外分发。
      # 四个 secret 只注入到实际消费的步骤 env，最小化暴露面（其余步骤读不到）。
      - name: 准备正式签名密钥
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: 提示未配置签名密钥
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，Release 产物将保持未签名，不能用于正式分发。"
      - name: 测试、Lint 与 APK 构建
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: 校验 Release 包签名
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::未找到已签名的 Release 包 $APK，请检查 signingConfig 是否生效。"
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
      - name: 保存验证报告与构建产物
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BetterHRBUST-Android
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/
          if-no-files-found: warn

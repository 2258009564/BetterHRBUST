name: Android 验证与构建

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装编译平台
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: 测试、Lint 与 APK 构建
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: 保存验证报告与构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetterHRBUST-Android
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/
          if-no-files-found: warn

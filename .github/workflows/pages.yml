name: 发布 GitHub Pages

on:
  push:
    branches: [main]
    paths: ['landing/**', 'web/src/**', 'shared/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['landing/**', 'web/src/**', 'shared/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: 构建发布页
        working-directory: landing
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist
  deploy:
    if: github.repository == 'Glassous/BetterHRBUST' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

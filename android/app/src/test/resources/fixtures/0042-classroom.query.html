    function checkForm(){
        if(form1.buildingid.value=="-1"){
            alert("请选择教学楼");
            return false;
        }
        else{
			if(form1.room.value=="-1"){
            	alert("请选择教室");
            	return false;
        	}
			else{
            	form1.action="./roomschedule.jsdo";
			}
        }
    }

	function checkWeekForm(){

            return false;
        }
        if(form1.whichweek.value=="-1"){
            alert("请选择第几周");
            return false;
        }
        else{
            form1.action="./roomschedule_week.jsdo";
		}
    }
</script>
